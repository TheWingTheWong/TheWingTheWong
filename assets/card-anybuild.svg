<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260" viewBox="0 0 400 260">
<style>.sh{animation:sh 4s ease-in-out infinite}@keyframes sh{0%{transform:translateX(-400px)}60%,100%{transform:translateX(400px)}}
.dot{animation:d 1.8s ease-in-out infinite}@keyframes d{50%{opacity:.3}}</style>
<defs>
<linearGradient id="b" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="400" y2="260" spreadMethod="reflect"><stop offset="0" stop-color="#a855f7"/><stop offset=".5" stop-color="#a855f7" stop-opacity=".1"/><stop offset="1" stop-color="#a855f7"/>
<animateTransform attributeName="gradientTransform" type="translate" values="0 0;400 260;0 0" dur="6s" repeatCount="indefinite"/></linearGradient>
<radialGradient id="gl" cx="1" cy="0" r="1"><stop offset="0" stop-color="#a855f7" stop-opacity=".3"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
<linearGradient id="s" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect width="400" height="260" rx="16"/></clipPath></defs>
<g clip-path="url(#c)"><rect width="400" height="260" fill="#0a0d14"/><rect width="400" height="260" fill="url(#gl)"/>
<rect class="sh" x="0" y="0" width="240" height="260" fill="url(#s)" transform="skewX(-20)"/></g>
<rect x="1.5" y="1.5" width="397" height="257" rx="15" fill="none" stroke="url(#b)" stroke-width="2"/>
<circle class="dot" cx="34" cy="38" r="5" fill="#a855f7"/>
<text x="48" y="43" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" letter-spacing="1.5" fill="#a855f7">HACKATHON BUILD</text>
<text x="372" y="43" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#7d8590"></text>
<text x="28" y="90" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="32" font-weight="800" fill="#f0f6fc">AnyBuild</text>
<text x="28" y="124" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#9da7b3">Describe a robot → Claude designs</text><text x="28" y="147" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#9da7b3">it in 3D → 1,024 browser</text><text x="28" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#9da7b3">simulations → parts, guide,</text><text x="28" y="193" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#9da7b3">firmware.</text>
<rect x="28" y="214" width="76" height="26" rx="13" fill="#a855f7" fill-opacity=".12" stroke="#a855f7" stroke-opacity=".5"/><text x="66" y="231.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#a855f7">Claude</text><rect x="112" y="214" width="40" height="26" rx="13" fill="#a855f7" fill-opacity=".12" stroke="#a855f7" stroke-opacity=".5"/><text x="132" y="231.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#a855f7">3D</text><rect x="160" y="214" width="49" height="26" rx="13" fill="#a855f7" fill-opacity=".12" stroke="#a855f7" stroke-opacity=".5"/><text x="184.5" y="231.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#a855f7">Sim</text>
</svg>