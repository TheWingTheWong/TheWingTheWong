name: daily pulse

on:
  schedule:
    - cron: '23 10 * * *'   # main run
    - cron: '41 17 * * *'   # backup run (no-op if today is already done)
  workflow_dispatch:
    inputs:
      force:
        description: 'Pulse again even if today already ran'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/**']

permissions:
  contents: write

concurrency:
  group: pulse
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Daily commits (random count = random shade)
        env:
          FORCE: ${{ inputs.force }}
        run: |
          git config user.name  "Ansorjon Juraev"
          git config user.email "145329570+TheWingTheWong@users.noreply.github.com"
          node scripts/pulse.mjs
          git pull --rebase -q origin main
          git push -q origin HEAD:main

      - name: Build hero, terminal and cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build.mjs

      - name: 3D contribution skyline
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/3d-settings.json

      - name: Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/raw/snake.svg?color_snake=#ffb000&color_dots=#1a1a1a,#4a4a4a,#8a8a8a,#b9b5a9,#e6e2d6

      - name: Frame snake and skyline in the void screen
        run: |
          sudo chown -R "$(id -u):$(id -g)" . || true
          node scripts/frame.mjs

      - name: Commit visuals
        run: |
          git add assets
          if git diff --cached --quiet; then echo "no visual changes"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "chore: refresh profile visuals"
          git pull --rebase -q origin main
          git push -q origin HEAD:main
