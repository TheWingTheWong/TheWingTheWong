name: refresh profile

on:
  schedule:
    - cron: '53 10 * * *'   # after the daily pulse in pulse-archive
    - cron: '11 18 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/**']

permissions:
  contents: write

concurrency:
  group: pulse
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build the screens
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build.mjs

      - name: Commit visuals
        run: |
          git add assets
          if git diff --cached --quiet; then echo "no visual changes"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "chore: refresh profile visuals"
          git pull --rebase -q origin main
          git push -q origin HEAD:main
